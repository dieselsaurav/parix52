# ============================================================================
# corne-rmk — Corne (crkbd) split, 2x nice!nano (nRF52840), wireless BLE.
#   Left half  = central    (talks USB/BLE to the host, owns the keymap, runs Vial)
#   Right half = peripheral (talks BLE to the central only)
#
# Ported from the ZMK config (dieselsaurav/zmk-for-keyboards corne) with the
# feature set of the sofle-rmk port (dieselsaurav/rmk-for-sofle); schema
# conventions and the vendored BLE patch come from yuyudhan-rmk-config.
# This file IS the firmware's keymap: read at COMPILE TIME by the RMK
# proc-macro (via KEYBOARD_TOML_PATH in .cargo/config.toml).
#
# Pin map = ZMK `corne` shield + nice!nano pro_micro mapping:
#   rows  pro_micro 4,5,6,7          = P0_22 P0_24 P1_00 P0_11
#   cols  pro_micro 21,20,19,18,15,14 (left, mirrored on the right)
# (pro_micro → nRF pin table verified 1:1 against the working sofle-rmk port.)
# ============================================================================
[keyboard]
name = "parix52-rmk"
product_name = "Parix 52"
vendor_id = 0x4c4b
product_id = 0x5052
manufacturer = "Parix"
chip = "nrf52840"

# Both DC/DC converters OFF, which is RMK's nRF default. REG1 was switched on
# for a build on 2026-09-28 to cut radio current, and the board never came up
# after flashing: a module without the DC/DC inductor (nice!nano clones often
# omit it) loses its core supply the moment the converter is enabled. Do not
# enable either without confirming the inductor is fitted on the module.
[chip.nrf52840]
dcdc_reg0 = false
dcdc_reg1 = false

# ----------------------------------------------------------------------------
# ble_profiles_num = 4 defines the User0..User7 keycodes on the MEDIA layer:
#   User0-3 = select profile BT0-BT3, User4 = next, User5 = prev,
#   User6 = clear-bond (ZMK BT_CLR), User7 = toggle USB/BLE (ZMK OUT_TOG).
# The MEDIA layer below and config/vial.json hard-code these positions.
# ----------------------------------------------------------------------------
[rmk]
ble_profiles_num = 4
# 14 combos ported from ZMK (default slot limit is 8)
combo_max_num = 16
# Sleep after 60 s without a key or a pointer move on either half: the
# lights, the OLED and the trackpad lose their supply (src/rgb.rs switches
# the module's VCC output off), and the split link relaxes. Any key on
# either half wakes everything; the trackpad cannot, it has no power then.
# (RMK has no ZMK-style System-OFF deep sleep.)
split_central_sleep_timeout_seconds = 60

# On-chip flash storage (Vial live-remaps, BLE bonds, selected profile
# survive power-off).
#
# RMK's nRF default is 0xA0000 with 32 sectors; this image is ~490 KB and
# the layout below keeps the store just under the bootloader instead.
#
# num_sectors is NOT left at RMK's default of 2 either. RMK writes EVERY key
# of every layer into the store on first boot -- 5 x 12 x 8 = 480 entries at
# ~16 bytes each, 7.7 KB -- plus the layout, behaviour and macro blobs and up
# to four BLE bonds, about 10 KB live. sequential-storage keeps one page as
# a migration buffer, so the live data has to fit in num_sectors - 1 pages
# of 4 KB. With 2 sectors that is 4 KB: the keymap never fully stored, and
# every Vial edit afterwards failed with "storage full" and was lost on the
# next power-up. 8 sectors = 28 KB usable, and the macro refuses to build
# a config whose keymap cannot fit.
#
# 0xEC000 + 8 x 4 KB ends at 0xF4000, exactly where the Adafruit bootloader
# begins. memory.x caps the image at 0xEC000 so the linker refuses any build
# that would reach the storage.
[storage]
start_addr = 0xEC000
num_sectors = 8

# ----------------------------------------------------------------------------
# Bluetooth (host side) + battery reporting.
# battery_adc_pin = "vddh": nRF52840 measures its own supply rail internally
# (same as ZMK's zmk,battery-nrf-vddh in the corne overlays — no extra wiring).
# default_tx_power = 8 dBm, same as ZMK CONFIG_BT_CTLR_TX_PWR_PLUS_8.
# ----------------------------------------------------------------------------
[ble]
enabled = true
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806
default_tx_power = 8

# Vial unlock: hold the two inner LEFT THUMB keys — electrical (3,4)+(3,5)
# = LT(1,Space) and LT(6,Tab) — while vial.rocks shows the unlock prompt.
[host]
unlock_keys = [[4, 5], [4, 4]]

# ----------------------------------------------------------------------------
# ELECTRICAL matrix: 4 rows x 12 cols (6 cols per half), 42 keys used.
# Row 3 = thumb row: (3,3)-(3,5) left, (3,6)-(3,8) right — same as the ZMK
# matrix transform. ,L/,R tags feed unilateral_tap in the HRM morse profile.
# ----------------------------------------------------------------------------
[layout]
rows = 5
cols = 12
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L)   (0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L)   (1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L)   (2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L)   (3,6,R) (3,7,R) (3,8,R) (3,9,R) (3,10,R) (3,11,R)
                                (4,5,L) (4,4,L)   (4,7,R) (4,6,R)
"""

# ============================================================================
# KEYMAP — 8 layers: 0-6 = the seven typing layers (Miryoku-style, 1:1 from
# the ZMK corne keymap), 7 = DISPOFF (transparent; blanks the OLEDs and kills
# the RGB, toggled by TG(7) on MEDIA).
# ============================================================================

# Layer 0 — BASE. QWERTY, GACS home-row mods (tap = letter, hold = mod, tuned
# by the HRM profile), Hyper on right pinky (ZMK &hyper macro). Thumbs, left
# to right: Space=MEDIA Tab=NAV | Enter=SYM Backspace=NUM.
[keymap]
layers = 8

[[keymap.layer]]
name = "BASE"
keys = """
LT(6, Grave, TL)       Kc1              Kc2              Kc3               Kc4                Kc5                  Kc6                  Kc7                Kc8               Kc9              Kc0                  LT(5, Minus, TL)
Tab                    Q                W                E                 R                  T                    Y                    U                  I                 O                P                    Backspace
MT(Escape, LCtrl, HRM) MT(A, LGui, HRM) MT(S, LAlt, HRM) MT(D, LCtrl, HRM) MT(F, LShift, HRM) G                    H                    MT(J, RShift, HRM) MT(K, RCtrl, HRM) MT(L, RAlt, HRM) MT(Quote, RGui, HRM) WM(No, LCtrl | LShift | LAlt | LGui)
LShift                 Z                X                C                 V                  B                    N                    M                  Comma             Dot              Slash                Escape
                                                                           LT(3, Space, TL)   LT(1, Tab, TL)       LT(4, Enter, TL)     LT(2, Backspace, TL)
"""

# Layer 1 — NAV (hold TAB). Vim arrows right home row, clipboard chords
# top right (macOS: Cmd-based), pre-held GACS mods left home row.
[[keymap.layer]]
name = "NAV"
keys = """
No No   No   No    No     No    No                   No          No          No          No          No
No No   No   No    No     No    WM(Z, LGui | LShift) WM(V, LGui) WM(C, LGui) WM(X, LGui) WM(Z, LGui) No
No LGui LAlt LCtrl LShift No    Left                 Down        Up          Right       CapsLock    No
No No   No   No    No     No    Insert               Home        PageDown    PageUp      End         No
                   No     No    Backspace            Enter
"""

# Layer 2 — NUM (hold BACKSPACE). Columnar numpad on the left hand, mirror
# mods on the right home row.
[[keymap.layer]]
name = "NUM"
keys = """
No No          No  No  No  No              No No     No    No   No   No
No LeftBracket Kc7 Kc8 Kc9 RightBracket    No No     No    No   No   No
No Semicolon   Kc4 Kc5 Kc6 Equal           No RShift RCtrl RAlt RGui No
No Grave       Kc1 Kc2 Kc3 Backslash       No No     No    No   No   No
                       Kc0 Dot             No No
"""

# Layer 3 — MEDIA (hold SPACE). Media transport + all Bluetooth management:
#   User0-3 = select BT profile 0-3    User6 = clear bond of CURRENT profile
#   User7   = toggle output USB <-> BLE  TG(7) = blank OLEDs + RGB (layer 7)
#   User12 = base layer light on/off   User13 / User14 = key lights dimmer /
#   brighter   User15 = next base colour (all four: vendor/rmk key_light.rs)
#   User10 / User11 = the OLED one step dimmer / brighter (five steps, kept
#   across power-offs; a patch in vendor/rmk, see PATCH.md)
#   No Bootloader key. RMK's jump is a SOFT reset, the nRF52 watchdog
#   survives a soft reset, and the Adafruit bootloader never feeds it: the
#   DFU session would be killed 10 s in, mid-copy. Double-tap the reset
#   button instead -- a PIN reset does clear the watchdog.
# (ZMK rgb_ug / ext_power keys not ported — no RMK support yet; TG(7) is the
# RGB kill switch instead.)
[[keymap.layer]]
name = "MEDIA"
keys = """
No No   No   No    No     No    No             User15         User12       User13     User14         No
No No   No   No    No     No    TG(7)          BrightnessDown BrightnessUp User10     User11         No
No LGui LAlt LCtrl LShift No    No             MediaPrevTrack AudioVolDown AudioVolUp MediaNextTrack No
No No   No   No    No     No    User7          User0          User1        User2      User3          User6
                   No     No    MediaPlayPause MediaStop
"""

# Layer 4 — SYM (hold ENTER). NUM layer with shift applied: same positions,
# shifted symbols ({ & * ( } etc.). Thumbs: ( ) _ (ZMK LPAR RPAR UNDER).
[[keymap.layer]]
name = "SYM"
keys = """
No No                   No           No           No           No                       No No     No    No   No   No
No SHIFTED(LeftBracket) SHIFTED(Kc7) SHIFTED(Kc8) SHIFTED(Kc9) SHIFTED(RightBracket)    No No     No    No   No   No
No SHIFTED(Semicolon)   SHIFTED(Kc4) SHIFTED(Kc5) SHIFTED(Kc6) SHIFTED(Equal)           No RShift RCtrl RAlt RGui No
No SHIFTED(Grave)       SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Backslash)       No No     No    No   No   No
                                                  SHIFTED(Kc0) SHIFTED(Kc9)             No No
"""

# Layer 5 — FUN (hold DELETE). F-keys columnar like NUM.
[[keymap.layer]]
name = "FUN"
keys = """
F1 F2  F3 F4 F5    F6             F7 F8     F9    F10  F11  F12
No F12 F7 F8 F9    PrintScreen    No No     No    No   No   No
No F11 F4 F5 F6    ScrollLock     No RShift RCtrl RAlt RGui No
No F10 F1 F2 F3    Pause          No No     No    No   No   No
             Space Menu           No No
"""

# Layer 6 — MOUSE (hold TAB). Pointer on the right home row, scroll below,
# buttons on the thumbs. ZMK MCLK/LCLK/RCLK = RMK Btn3/Btn1/Btn2.
[[keymap.layer]]
name = "MOUSE"
keys = """
No No   No   No    No     No    No             No             No           No              No No
No No   No   No    No     No    No             No             No           No              No No
No LGui LAlt LCtrl LShift No    MouseLeft      MouseDown      MouseUp      MouseRight      No No
No No   No   No    No     No    MouseWheelLeft MouseWheelDown MouseWheelUp MouseWheelRight No No
                   No     No    MouseBtn1      MouseBtn2
"""

# Layer 7 — DISPOFF (toggled by TG(7) on MEDIA). Fully transparent; only
# signals the OLED renderers and the RGB processor (layer == 7) to go dark.
[[keymap.layer]]
name = "DISPOFF"
keys = """
_______ _______ _______ _______ _______ _______    _______ _______ _______ _______ _______ _______
_______ _______ _______ _______ _______ _______    _______ _______ _______ _______ _______ _______
_______ _______ _______ _______ _______ _______    _______ _______ _______ _______ _______ _______
_______ _______ _______ _______ _______ _______    _______ _______ _______ _______ _______ _______
                                _______ _______    _______ _______
"""

# ============================================================================
# COMBOS — ported 1:1 from the ZMK config. Actions must match the keymap
# tokens exactly (including morse profile args) to bind to those keys.
# ============================================================================
[behavior.combo]
timeout = "50ms"
combos = [
    # Tier 1: essential
    { actions = ["MT(F, LShift, HRM)", "MT(J, RShift, HRM)"], output = "CapsWordToggle" },
    { actions = ["Q", "W"], output = "Escape" },
    { actions = ["O", "P"], output = "Backspace" },
    # Tier 2: high value
    { actions = ["X", "C"], output = "WM(C, LGui)" },
    { actions = ["C", "V"], output = "WM(V, LGui)" },
    { actions = ["X", "V"], output = "WM(X, LGui)" },
    # Tier 3: vertical symbol combos
    { actions = ["MT(J, RShift, HRM)", "M"], output = "Minus" },
    { actions = ["H", "N"], output = "SHIFTED(Minus)" },
    { actions = ["MT(F, LShift, HRM)", "V"], output = "Equal" },
    { actions = ["MT(S, LAlt, HRM)", "X"], output = "Grave" },
    { actions = ["MT(L, RAlt, HRM)", "MT(Quote, RGui, HRM)"], output = "Semicolon" },
]

# ============================================================================
# TAP-HOLD ("morse") tuning — timings carried over from the ZMK config:
# tapping-term 200ms, require-prior-idle 150ms, quick-tap 175ms.
#   HRM (home-row mods): flow-tap + permissive-hold + unilateral_tap —
#     biased hard toward "it's a letter" (ZMK mt tap-preferred + prior-idle).
#   TL (thumb layer-taps): flow-tap OFF (holding Space for NAV mid-streak
#     must not force a literal space), permissive-hold ≈ ZMK lt "balanced".
# ============================================================================
[behavior.morse]
enable_flow_tap = true
prior_idle_time = "150ms"
hold_timeout = "200ms"
gap_timeout = "175ms"

[behavior.morse.profiles]
HRM = { enable_flow_tap = true, permissive_hold = true, unilateral_tap = true, hold_timeout = "200ms", gap_timeout = "175ms" }
TL = { enable_flow_tap = false, permissive_hold = true, hold_timeout = "200ms", gap_timeout = "175ms" }

# ============================================================================
# SPLIT — halves talk BLE; only the central talks to the computer.
# ble_addr: fixed static random addresses; the halves find each other by
# these (unique per half, distinct from any other RMK board in range —
# including the sofle-rmk pair).
# ============================================================================
[split]
connection = "ble"

# ---- LEFT half = central ----
[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
ble_addr = [0x52, 0x10, 0x58, 0x49, 0x72, 0xd5]
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806

# Corne left wiring: rows pro_micro 4,5,6,7; cols 21,20,19,18,15,14.
# Default (deferred) debouncer: the eager "fast" one caused stuck/repeating
# keys on the sofle port — keep the default here too.
[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11", "P1_04"]
col_pins = ["P0_31", "P0_29", "P0_02", "P1_15", "P1_13", "P1_11"]

# Central OLED — SSD1306 128x32, ZMK-built-in-style status renderer
# (output/profile, battery, layer name). Event-driven only.
# If content renders upside-down for your mount, change rotation to 180.
[split.central.display]
driver = "ssd1306"
size = "128x32"
rotation = 0
renderer = "crate::status::StatusRenderer"

[split.central.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_17"
scl = "P0_20"

# ---- RIGHT half = peripheral ----
[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
ble_addr = [0x53, 0x10, 0x58, 0x49, 0x72, 0xe6]
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806

# Right half mirrors the left: cols pro_micro 14,15,18,19,20,21.
[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11", "P1_04"]
col_pins = ["P1_11", "P1_13", "P1_15", "P0_02", "P0_29", "P0_31"]

# Right (peripheral): Cirque TM040040-2024-303 trackpad on the display header,
# in place of the OLED. SPI build (R1 fitted), curved overlay. Pad "SCK" ->
# header pad 2 (P0.20), "SI" -> pad 1 (P0.17), "SS" -> pad 5 (P0.06), "SO" ->
# nice!nano D9 (P1.06), "DR" -> D10 (P0.09, NFC pin used as GPIO); VDD/GND on
# pads 3/4. DR is wired (PCB label P10): the driver reads one packet per
# data-ready pulse instead of polling the status register.
# Orientation measured on the desk: the pad is mounted with its X axis along
# the finger's up/down, so the axes are swapped. 2026-10-03: the pad now sits
# with its notched corner at the TOP; with that, X is not inverted (it was
# with the notch at the bottom). (Processor order: invert, then swap.)
[[split.peripheral.input_device.pinnacle]]
name = "trackpad"
id = 0
# curved_overlay applies Cirque's gain/edge values for their curved overlay.
# Required: with it off the pad does not see a finger through the -303
# overlay at all (tested 2026-10-01).
curved_overlay = true
dr = "P0_09"
# Touching the pad holds the MOUSE layer (6) for 650 ms after the last motion:
# right thumbs become left / right click, right home row the wheel keys.
auto_layer = 6
auto_layer_timeout_ms = 650
# Scroll ring: the outer 20 % of the pad (a 4 mm band) is a wheel, one tick
# per 15 degrees, clockwise = scroll down. A touch that lands in the band
# becomes a scroll only once it has travelled along the ring; travelling
# across it, towards the centre, makes it an ordinary cursor move. The pad
# runs in absolute mode for this and the cursor speed comes from
# cursor_divisor (higher = slower).
scroll_ring = true
ring_width_percent = 20
ring_degrees_per_tick = 15
cursor_divisor = 3
# Tap to click: a touch under 200 ms that stays where it landed is a left
# click. Right click stays on the Backspace thumb while the pad is in use.
tap = true
tap_term_ms = 200
# Cursor glide: lift the finger while it is still moving and the cursor
# coasts to a stop; touching the pad stops it. Friction and trigger are
# QMK's defaults (0.4 and 10); raise the friction for a shorter glide, raise
# the trigger to need a faster flick.
glide = true
glide_friction = 40
glide_trigger = 10
proc_swap_xy = true
proc_invert_x = false
proc_invert_y = true

[split.peripheral.input_device.pinnacle.spi]
instance = "TWISPI0"
sck = "P0_20"
mosi = "P0_17"
miso = "P1_06"
cs = "P0_06"
