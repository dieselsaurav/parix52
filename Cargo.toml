[package]
name = "parix52-rmk"
version = "0.1.0"
authors = ["Kumar Saurav <diesel.saurav@gmail.com>"]
description = "Parix 52 split keyboard firmware (RMK, nRF52840 Pro Micro, wireless BLE, per-key RGB, SSD1306)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { path = "vendor/rmk/rmk", features = [
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
    "ssd1306",
] }
nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor= { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"
embedded-graphics = "0.8"
embedded-storage = "0.3"

u8g2-fonts = "0.8.0"
heapless = "0.9"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

# Settings-reset firmware (ZMK settings_reset equivalent) — erases RMK's
# storage region (bonds, Vial remaps); one binary, safe on either half.
[[bin]]
name = "reset"
path = "src/reset.rs"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"

# RMK is vendored at the revision in vendor/rmk/UPSTREAM_REV, with this
# keyboard's patches; vendor/rmk/PATCH.md lists them. rmk-macro, rmk-types
# and rmk-config are path-deps inside that tree.

# nrf-mpsl 0.4.0 from crates.io with the flash timeslot driver reshaped so a
# flash write fits between radio events and never panics in the timeslot
# callback. See vendor/nrf-mpsl/FLASH_PATCH.md.
[patch.crates-io]
nrf-mpsl = { path = "vendor/nrf-mpsl" }
